<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>ShopSphere | Admin Login</title>

    <link
        rel="stylesheet"
        href="../css/style.css">

    <link
        rel="stylesheet"
        href="../css/admin-login.css">

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <div class="header-container">

            <div class="logo">

                <a href="../index.html">
                    ShopSphere
                </a>

            </div>


            <nav class="main-navigation">

                <a href="../index.html">
                    Home
                </a>

                <a href="products.html">
                    Products
                </a>

                <a href="vendors.html">
                    Sellers
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================================
         ADMIN LOGIN
    ====================================================== -->

    <main class="admin-login-page">

        <section class="admin-login-card">


            <div class="admin-login-header">

                <p class="login-label">
                    ADMIN CENTER
                </p>

                <h1>
                    Admin Login
                </h1>

                <p>
                    Sign in to manage ShopSphere.
                </p>

            </div>



            <!-- LOGIN FORM -->

            <form id="admin-login-form">


                <div class="form-group">

                    <label for="admin-email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="admin-email"
                        placeholder="Enter admin email"
                        required>

                </div>



                <div class="form-group">

                    <label for="admin-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="admin-password"
                        placeholder="Enter admin password"
                        required>

                </div>



                <button
                    type="submit"
                    id="admin-login-button">

                    Login as Admin

                </button>



                <p
                    id="admin-login-message"
                    class="admin-login-message">
                </p>


            </form>


        </section>

    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <div class="footer-bottom">

            <p>
                © 2026 ShopSphere. All Rights Reserved.
            </p>

        </div>

    </footer>



    <script
        src="../js/admin-login.js">
    </script>

</body>

</html>
