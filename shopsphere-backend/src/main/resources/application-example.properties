# ShopSphere Backend Configuration Example
# Copy this file to application.properties and update the values locally.

spring.application.name=shopsphere-backend

spring.datasource.url=jdbc:mysql://localhost:3306/ShopSphere
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true